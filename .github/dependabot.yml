version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: {interval: weekly}
    labels: [dependencies]
    groups:
      python: {patterns: ["*"], update-types: [minor, patch]}
  - package-ecosystem: npm
    directory: /web
    schedule: {interval: weekly}
    labels: [dependencies]
    groups:
      web: {patterns: ["*"], update-types: [minor, patch]}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    labels: [dependencies]
