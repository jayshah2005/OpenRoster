# Dependency updates, batched so there are at most two PRs per ecosystem each week:
# minor/patch updates in one PR (auto-merged once CI passes, see workflows/automerge.yml) and
# major upgrades in another PR for a person to review. GitHub Actions updates come as one PR.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: {interval: weekly}
    labels: [dependencies]
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]
      python-major:
        patterns: ["*"]
        update-types: [major]
  - package-ecosystem: npm
    directory: /web
    schedule: {interval: weekly}
    labels: [dependencies]
    groups:
      web:
        patterns: ["*"]
        update-types: [minor, patch]
      web-major:
        patterns: ["*"]
        update-types: [major]
    ignore:
      # typescript-eslint (used by eslint-config-next) refuses TypeScript 7 for now. Lift this once
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940 is resolved.
      - dependency-name: typescript
        versions: [">=7"]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    labels: [dependencies]
    groups:
      actions:
        patterns: ["*"]
