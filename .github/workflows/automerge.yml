name: Dependabot auto-merge

# Minor and patch dependency updates merge themselves only after CI passes on the PR. The job waits for the
# checks itself, so this holds even before branch protection is turned on.
on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v2
      - if: steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
        run: |
          sleep 30   # let the CI checks register on the PR
          gh pr checks "$PR" --watch --fail-fast --interval 30
          gh pr merge --squash "$PR"
