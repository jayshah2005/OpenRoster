name: Deploy

# Builds the Next.js site in Actions and uploads the prebuilt output to Vercel, so no Vercel build minutes
# are used. Runs on pushes to main by people, and is called by "Update data" after each data commit
# (pushes made with GITHUB_TOKEN do not trigger other workflows).
on:
  push:
    branches: [main]
    paths: ["web/**", "data/records/**", "data/archive/**", "config/**"]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
      NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.OPENROSTER_CONTACT }}
    steps:
      - uses: actions/checkout@v5
        with: {ref: main}
      - uses: actions/setup-node@v7
        with: {node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json}
      - name: Check secrets
        id: secrets
        env:
          HAS_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::notice::Skipping deploy: VERCEL_TOKEN is not set yet (see docs/setup.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ready == 'true'
        working-directory: web
        run: |
          npm ci
          npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
