name: Update data

on:
  schedule:
    - cron: "17 */6 * * *"     # every 6 hours
  workflow_dispatch:
    inputs:
      only:
        description: "Space-separated source ids to run (empty = all)"
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    env:
      OPENROSTER_CONTACT: ${{ vars.OPENROSTER_CONTACT }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: {enable-cache: true}
      - run: uv sync --frozen
      - name: HTTP cache (ETag / Last-Modified validators)
        uses: actions/cache@v6
        with:
          path: data/cache
          key: http-cache-${{ github.run_id }}
          restore-keys: http-cache-
      - name: Headless browser (only if a reviewed source needs it)
        run: |
          if grep -l "adapter: headless" config/sources/*.yaml | xargs grep -q "reviewed: true"; then
            uv sync --frozen --extra headless && uv run playwright install --with-deps chromium
          fi
      - name: Scrape
        env:
          ONLY: ${{ inputs.only }}
        run: |
          if [ -n "$ONLY" ]; then uv run openroster scrape --only $ONLY; else uv run openroster scrape; fi
      - name: Validate
        run: uv run openroster validate
      - name: Refresh LISTINGS.md
        run: uv run openroster listings
      - name: Commit if data changed
        id: commit
        run: |
          git config user.name "openroster-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in data reports LISTINGS.md; do if [ -e "$p" ]; then git add "$p"; fi; done
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore/data: update listings $(date -u +%Y-%m-%d)"
            # If someone changed data/ while this ran, the rebase can conflict. Fail loudly instead of reporting
            # success with nothing pushed; the next run starts from the new main and redoes the work.
            if ! git pull --rebase --autostash; then
              git rebase --abort || true
              echo "::error::main changed data/ during this run and the data commit conflicts; nothing was pushed."
              exit 1
            fi
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Status and red flags (shown on the run's summary page)
        if: always()
        run: uv run openroster status --summary-file "$GITHUB_STEP_SUMMARY"
      - name: Health issues (open, update, close)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run openroster health --sync
  # No deploy job: Vercel's GitHub integration deploys every push to main (including the data commit above)
  # to production, and every pull request to a preview URL. See docs/setup.md.
