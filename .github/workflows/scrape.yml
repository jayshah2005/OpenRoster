name: Update data

on:
  schedule:
    - cron: "17 */6 * * *"     # every 6 hours
  workflow_dispatch:
    inputs:
      only:
        description: "Space-separated source ids to run (empty = all)"
        required: false
      force_deploy:
        description: "Deploy even if no data changed"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    env:
      OPENROSTER_CONTACT: ${{ vars.OPENROSTER_CONTACT }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with: {enable-cache: true}
      - run: uv sync --frozen
      - name: HTTP cache (ETag / Last-Modified validators)
        uses: actions/cache@v6
        with:
          path: data/cache
          key: http-cache-${{ github.run_id }}
          restore-keys: http-cache-
      - name: Headless browser (only if a reviewed source needs it)
        run: |
          if grep -l "adapter: headless" config/sources/*.yaml | xargs grep -q "reviewed: true"; then
            uv sync --frozen --extra headless && uv run playwright install --with-deps chromium
          fi
      - name: Scrape
        env:
          ONLY: ${{ inputs.only }}
        run: |
          if [ -n "$ONLY" ]; then uv run openroster scrape --only $ONLY; else uv run openroster scrape; fi
      - name: Validate
        run: uv run openroster validate
      - name: Commit if data changed
        id: commit
        run: |
          git config user.name "openroster-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ reports/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore/data: update listings $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash && git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Health issues (open, update, close)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run openroster health --sync

  deploy:
    needs: scrape
    if: needs.scrape.outputs.changed == 'true' || inputs.force_deploy
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
