    filter: cs
    landing_url: https://vectorinstitute.ai/events/
  notes: 7 upcoming events. Mostly industry events, but it also lists student programs such as the FastLane MLA cohort calls (for grad students and recent grads). An iCal export is also at /events/?ical=1.
