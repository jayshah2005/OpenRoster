- id: hackclub-hackathons-api-upcoming
  name: Hack Club Hackathons API (upcoming events)
  adapter: hackclub
  url: https://hackathons.hackclub.com/api/events/upcoming
  owner: hackclub
  enabled: true
  reviewed: true
  page_budget: 3
  options:
    filter: all
    landing_url: https://hackathons.hackclub.com/data
  default_type: hackathon
  notes: JSON array of objects with keys id, name, website, start, end, createdAt, logo, banner, city, state, country, countryCode, latitude, longitude, virtual, hybrid, mlhAssociated, hack_club_event, apac. Has no query parameters, so filter on countryCode == "CA" on the client side. There were 14 upcoming events worldwide, 2 of them in Canada. Mostly high-school hackathons. /api/events/all also works but
- id: vector-institute-events
