[project]
name = "openroster"
version = "0.1.0"
description = "Open-source tracker of hackathons, info sessions and early-career opportunities for CS students"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "icalendar>=6.0",
  "recurring-ical-events>=3.3",
  "selectolax>=0.3.21",
  "protego>=0.3",
  "python-dateutil>=2.9",
  "rapidfuzz>=3.9",
  "jinja2>=3.1",
  "jsonschema>=4.26.0",
  "ruamel-yaml>=0.19.1",
]

[project.optional-dependencies]
headless = ["playwright>=1.47"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-PyYAML", "types-python-dateutil", "respx>=0.21"]

[project.scripts]
openroster = "openroster.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # long regexes read better unbroken; `ruff format` handles code layout

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
