  - id: bmo-student-events
    name: BMO Careers - Student Events (Canada)
    owner: bmo
    url: https://jobs.bmo.com/ca/en/student-events
    landing_url: https://jobs.bmo.com/ca/en/student-events
    platform: html
    expected_types: [workshop, info_session, networking, case_competition, hackathon]
    cs_relevance: medium
    login_required: false
    verified: true
    sample_event_titles: ["HerHacks Hackathon (Nov 28, 2026)", "AI at BMO: Learn Today, Lead Tomorrow", "BMO Den Pitch Competition (Nov 4, 2026)"]
    robots: allowed
    terms_url: https://jobs.bmo.com/ca/en/personal-information
    terms_notes: "Footer only links a Personal Information page; no scraping clause found."
    blocked_by: null
    outreach_contact: campus.recruiting@bmo.com
    notes: >-
      Phenom People careers site (assets on cdn.phenompeople.com). Event list is present in the fetched
      page content (Phenom server-renders page data), so plain HTML parsing works. Two blocks: "Virtual Workshops"
      (dates without year, ET times) and "On-campus or In-office" cards (dated 2026, tags like Networking /
      Case Competition / Information Session). Virtual workshops link to detail pages like
      https://jobs.bmo.com/ca/en/event/<24-hex-id>/<slug>; on-campus cards have no detail links.
      robots.txt only disallows apply/chatbot/jobcart/phenom-tracking paths; sitemaps at /ca/en/sitemap_index.xml
      (sitemap1.xml, sitemap2.xml; not confirmed to contain /event/ URLs). US page: /us/en/student-events-us.
      No JSON-LD or iCal seen. Phenom internal widget APIs exist but were not called.

