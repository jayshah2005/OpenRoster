  # ---------------- Western ----------------
  - id: western-events-json
    name: Western University events calendar (JSON export)
    owner: western
    url: https://www.uwo.ca/events/_data/current-live.json
    landing_url: https://www.uwo.ca/events/
    platform: api
    expected_types: [tech_talk, workshop, info_session, conference, networking, career_fair]
    cs_relevance: medium
    login_required: false
    verified: true
    sample_event_titles: ["What is Uncomputable?", "AI Fundamentals: Concepts and Guiding Principles", "Working in Canada – What You Need to Know"]
    robots: allowed
    terms_url: https://www.uwo.ca/terms-of-use.html
    terms_notes: "No scraping clause. Says users may not 'copy or distribute by any means the Content or any portion of it' without Western's prior written consent; link back rather than republish descriptions."
    blocked_by: null
    outreach_contact: null
    notes: "Large JSON (~550 KB, ~515 events). Fields: id, title, url, startDate, endDate, description, additionDetails, filter1 (event type, e.g. 'Lecture / Seminar', 'Training / Workshop'), filter4 (audience), filter5 (organizing unit). Filter on filter5 for Computer Science / Engineering / Careers units. Same CMS also publishes _data/current.ics, _data/current.rss and _data/current.xml. events.westernu.ca (older calendar host) refused connections."
  - id: western-events-ics
    name: Western University events calendar (iCal)
    owner: western
    url: https://www.uwo.ca/events/_data/current.ics
    landing_url: https://www.uwo.ca/events/
    platform: ics
    expected_types: [tech_talk, workshop, info_session, conference]
    cs_relevance: medium
    login_required: false
    verified: true
    sample_event_titles: ["Resumes & Cover Letters: Creating Compelling Correspondence", "Jira Helpdesk: Lifecycle of a Ticket", "Microsoft 365 Copilot In Action"]
    robots: allowed
    terms_url: https://www.uwo.ca/terms-of-use.html
    terms_notes: "Same as western-events-json."
    blocked_by: null
