agent: national
notes: >-
  "responds" means the official site answered a WebFetch on 2026-10-23. Many hackathon sites are JS-only, so a
  response with only a <title> still counts as responds: true, but details then come from search results or
  third-party pages (marked in notes). Luma calendar IDs were read from the public luma.com calendar page HTML
  (curl, no JSON/API endpoints used) and each iCal URL was fetched and confirmed to start with BEGIN:VCALENDAR.
  Devpost and MLH were not fetched, with one exception: fetching fellowship.mlh.io returned a 302 redirect to
  fellowship.mlh.com, which was not followed.

sources:
  - id: hackclub-hackathons-api-upcoming
    name: Hack Club Hackathons API (upcoming events)
    owner: hackclub
    url: https://hackathons.hackclub.com/api/events/upcoming
    landing_url: https://hackathons.hackclub.com/data
    platform: api
    expected_types: [hackathon]
    cs_relevance: high
    login_required: false
    verified: true
    sample_event_titles: ["Hack Peel", "ONHacks", "Teens Hack Houston"]
    robots: no_robots
    terms_url: https://hackathons.hackclub.com/data
    terms_notes: "If you use it, you must credit \"Hack Club Hackathons\" with a link to hackathons.hackclub.com."
    blocked_by: null
    outreach_contact: null
    notes: >-
      JSON array of objects with keys id, name, website, start, end, createdAt, logo, banner, city, state, country,
      countryCode, latitude, longitude, virtual, hybrid, mlhAssociated, hack_club_event, apac. Has no query
      parameters, so filter on countryCode == "CA" on the client side. There were 14 upcoming events worldwide,
      2 of them in Canada. Mostly high-school hackathons. /api/events/all also works but is large (about 1 MB).
  - id: vector-institute-events
    name: Vector Institute events (The Events Calendar REST)
    owner: vector-institute
    url: https://vectorinstitute.ai/wp-json/tribe/events/v1/events
    landing_url: https://vectorinstitute.ai/events/
    platform: tribe
    expected_types: [workshop, info_session, tech_talk, early_career_program]
    cs_relevance: medium
    login_required: false
    verified: true
    sample_event_titles: ["Vector Business Insights: Personal Productivity & Shadow AI", "AI Data Governance – Applied Project Insights"]
    robots: allowed
    terms_url: null
    terms_notes: "not checked"
    blocked_by: null
    outreach_contact: null
    notes: >-
      7 upcoming events. Mostly industry events, but it also lists student programs such as the FastLane MLA
      cohort calls (for grad students and recent grads). An iCal export is also at /events/?ical=1.

