    alt_urls: ["https://hackathons.hackclub.com/api/events/all"]
    docs: https://hackathons.hackclub.com/data
    verified: true
    format: "JSON array of objects: {id, name, website, start, end, createdAt, logo, banner, city, state, country, countryCode, latitude, longitude, virtual, hybrid, mlhAssociated, hack_club_event, apac}"
    notes: "No query parameters, so filter on countryCode == 'CA'. Requires a credit link to hackathons.hackclub.com. Source code: github.com/hackclub/hackathons."
