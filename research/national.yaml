    url: https://events.hackclub.com/api/events/upcoming
    verified: true
    format: "JSON array: {id, slug, title, desc, leader, cal, start, end, youtube, ama, amaForm, amaId, amaAvatar, avatar, approved, tags, interestCount, leaderSlackId, rsvpFormUrl}"
